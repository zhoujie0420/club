name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: club-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Apply-release self-test
        run: bash deploy/self-test-apply.sh

      - name: Go tests
        working-directory: server
        run: go test ./...

      - name: H5 typecheck and build
        working-directory: front
        run: |
          npm ci
          npm run type-check
          npm run build:h5

      - name: Build API
        working-directory: server
        run: |
          mkdir -p ../.artifacts
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../.artifacts/club-api ./cmd/api

      - name: Playwright against a throwaway database
        env:
          PORT: "18080"
          CLUB_DB_PATH: ${{ github.workspace }}/.artifacts/ci.db
          CLUB_WEB_DIR: ${{ github.workspace }}/front/dist/build/h5
          CLUB_ACCESS_CODE: ci-playwright
          APP_VERSION: ci
          CLUB_TEST_CODE: ci-playwright
        run: |
          .artifacts/club-api &
          echo $! > .artifacts/api.pid
          trap 'kill "$(cat .artifacts/api.pid)" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          cd front
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Pack rolling test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash deploy/pack-release.sh

      - name: Publish club-test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view club-test >/dev/null 2>&1; then
            gh release upload club-test \
              .artifacts/club-test.tar.gz \
              .artifacts/REVISION \
              .artifacts/club-test.tar.gz.sha256 \
              --clobber
            gh release edit club-test --notes "test env ${GITHUB_SHA}"
          else
            gh release create club-test \
              .artifacts/club-test.tar.gz \
              .artifacts/REVISION \
              .artifacts/club-test.tar.gz.sha256 \
              --title club-test \
              --notes "test env ${GITHUB_SHA}" \
              --latest=false
          fi
